name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Generated code and manifests are up to date
        run: |
          make generate manifests dashboard
          git diff --exit-code
      - uses: azure/setup-helm@v4
      - name: Lint chart
        run: helm lint charts/nodenap
