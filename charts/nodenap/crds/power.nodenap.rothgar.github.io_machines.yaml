                      auth:
                        description: |-
                          HTTPAuth is basic or digest auth from a Secret with "username" (optional,
                          default "admin") and "password".
                        properties:
                          secretRef:
                            description: SecretRef names a Secret. An empty namespace
                              means the controller's own.
                            properties:
                              name:
                                type: string
                              namespace:
                                type: string
                            required:
                            - name
                            type: object
                          type:
                            enum:
                            - basic
                            - digest
                            type: string
                        required:
                        - secretRef
                        - type
                        type: object
                      body:
                        type: string
                      field:
                        description: |-
