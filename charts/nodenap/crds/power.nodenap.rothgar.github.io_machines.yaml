          metadata:
            type: object
          spec:
            description: MachineSpec says how to switch and measure one physical machine.
            properties:
              alwaysOn:
                description: Never power off (still measured).
                type: boolean
              bootTimeout:
                description: Overrides the policy's scaleUp.bootTimeout.
                type: string
