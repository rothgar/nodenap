image:
  repository: ghcr.io/rothgar/nodenap
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# A PowerPolicy created with the release. In dry run (the default) nodenap
# only reports: status.suggestions lists which nodes could sleep, even before
# you create any Machines. See https://github.com/rothgar/nodenap.
policy:
  create: true
  dryRun: true
  # Your all-in electricity price per kWh (docs/power-costs.md).
  price: "0.20"
  currency: ""
  timeZone: ""
  minNodesOn: 1

# Wake-on-LAN broadcasts need to reach the machines' LAN.
hostNetwork: true

# Prefer an always-on control-plane node, but run anywhere if there isn't
# one. To pin it there (upgrades can otherwise land elsewhere, since the old
# pod's host ports block the node until it exits), use
# requiredDuringSchedulingIgnoredDuringExecution instead. If the node it runs on is powered off, the controller evicts itself
# last and its replacement on another node finishes the power-off.
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - {key: node-role.kubernetes.io/control-plane, operator: Exists}
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
nodeSelector: {}

metricsPort: 18080
probePort: 18081
logLevel: info

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 256Mi

serviceMonitor:
  enabled: false
  # Extra labels, e.g. {release: kube-prometheus-stack} when Prometheus only
  # selects ServiceMonitors with that label.
  labels: {}

# Grafana dashboard (power states, draw, energy and money saved) as a
# ConfigMap for the Grafana sidecar. Also in charts/nodenap/dashboards/ to
# import by hand.
grafanaDashboard:
  enabled: false
  labels:
    grafana_dashboard: "1"
  annotations: {}   # e.g. grafana_folder: Power
  namespace: ""     # default: the release namespace
