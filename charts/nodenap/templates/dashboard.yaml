{{- if .Values.grafanaDashboard.enabled }}
# Picked up by the Grafana dashboard sidecar (kube-prometheus-stack and the
# grafana chart load ConfigMaps labelled grafana_dashboard: "1").
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pa.name" . }}-dashboard
  {{- with .Values.grafanaDashboard.namespace }}
  namespace: {{ . }}
  {{- end }}
  labels:
    {{- include "pa.labels" . | nindent 4 }}
    {{- toYaml .Values.grafanaDashboard.labels | nindent 4 }}
  {{- with .Values.grafanaDashboard.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  nodenap.json: |-
{{ .Files.Get "dashboards/nodenap.json" | indent 4 }}
{{- end }}
